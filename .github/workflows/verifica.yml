name: Verifica

# Si avvia da sola su ogni push su main e su ogni pull request, e a mano dal
# pulsante «Run workflow»: `workflow_dispatch` è dichiarato, quindi il
# pulsante c'è. Istruzioni passo per passo in RUN-CI.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente della configurazione Firebase generata"
        required: true
        default: "emulatore"
        type: choice
        options: [emulatore, non-configurato, staging]
      aggiorna_riferimenti_visivi:
        description: "Rigenera gli scatti di riferimento (usare con cautela)"
        required: false
        default: false
        type: boolean

# Il progetto di produzione non deve essere raggiungibile da qui.
# `PT_PROGETTO_TEST` comincia per `demo-`, che l'emulatore riconosce come
# progetto dimostrativo, e i collaudi si interrompono se non è così.
env:
  PT_PROGETTO_TEST: demo-pannello
  PT_BASE_URL: http://127.0.0.1:8765
  # `__PT_TEST__` fa scattare vietaProduzioneNeiTest() nel codice.
  PT_MODO_TEST: "1"

jobs:

  # ───────────────────────────────────────────────────────────────────────
  # 1. BUILD — determinismo, unit, integrazione, avvio, sicurezza statica
  # ───────────────────────────────────────────────────────────────────────
  build:
    name: Build e collaudi locali
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Java (serve all'emulatore Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dipendenze
        run: npm ci || npm install

      - name: Configurazione Firebase per i collaudi
        # Mai la produzione: l'ambiente arriva dall'input, e il valore
        # predefinito è l'emulatore.
        run: node strumenti/genera-config-firebase.mjs --ambiente "${{ inputs.ambiente || 'emulatore' }}"

      - name: Nessun segreto nell'albero
        # Prima di tutto il resto: se un segreto è entrato nel repository,
        # tutto ciò che segue è secondario.
        run: node strumenti/controlla-segreti.mjs

      - name: Build
        run: node strumenti/build.mjs

      - name: Doppia build deterministica
        # Due build consecutive devono produrre la stessa impronta. Se
        # cambia, qualcosa dipende dall'ora o dall'ordine dei file, e le
        # cache dei service worker degli utenti diventano inaffidabili.
        run: |
          node strumenti/build.mjs --solo-impronta > /tmp/impronta-1.txt
          node strumenti/build.mjs --solo-impronta > /tmp/impronta-2.txt
          diff /tmp/impronta-1.txt /tmp/impronta-2.txt || {
            echo "BUILD NON DETERMINISTICA";
            cat /tmp/impronta-1.txt /tmp/impronta-2.txt;
            exit 1;
          }
          echo "impronta stabile: $(cat /tmp/impronta-1.txt)"

      - name: Impronta coerente nei quattro punti
        # build.json, js/versione.js, sw.js e index.html devono coincidere.
        # Se divergono, il service worker serve una build e la pagina un'altra.
        run: node strumenti/controlla-impronta.mjs

      - name: Nessuna collisione fra nomi globali
        # I 60 moduli condividono un unico scope: due `var` con lo stesso
        # nome e il primo perde il proprio valore in silenzio. È già
        # successo — `LIMITI` in sicurezza.js contro `LIMITI` in
        # appcheck.js — e ha disattivato TUTTI i limiti di importazione
        # senza un solo messaggio d'errore.
        run: node strumenti/controlla-globali.mjs

      - name: Backlog coerente con la matrice
        # I conteggi di BACKLOG-COVERAGE.md non si scrivono a mano: la fonte
        # è backlog.json. Questo passo li ricalcola e fallisce se non
        # coincidono, o se un ticket COMPLETATO si appoggia a una verifica
        # dichiarata non eseguita.
        run: node strumenti/backlog.mjs

      - name: Unit test
        run: node tests/runner.js --solo unit

      - name: Integration test
        run: node tests/runner.js --solo integration

      - name: Test di avvio
        # Il pannello deve disegnarsi senza errori in un DOM finto: un
        # ReferenceError in un modulo lascia la pagina bianca, e questo lo
        # scopre prima del browser.
        run: node tests/avvio.test.js

      - name: Regole Firestore su Emulator
        # `emulators:exec` avvia l'emulatore, esegue e spegne. Il codice 2
        # del collaudo significa SALTATO, e qui è un fallimento: in CI la
        # libreria c'è, quindi «saltato» vuol dire che qualcosa non va.
        run: |
          npx firebase emulators:exec \
            --only firestore,auth \
            --project "$PT_PROGETTO_TEST" \
            "node tests/security/regole.test.js"

      - name: Artefatti della build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build.json
            /tmp/impronta-*.txt
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────
  # 2. BROWSER — Playwright, CSP, PWA, offline, responsive, accessibilità
  # ───────────────────────────────────────────────────────────────────────
  browser:
    name: Collaudi in browser
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dipendenze
        run: npm ci || npm install

      - name: Configurazione Firebase per i collaudi
        run: node strumenti/genera-config-firebase.mjs --ambiente "${{ inputs.ambiente || 'emulatore' }}"

      - name: Build
        run: node strumenti/build.mjs

      - name: Installa il browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Servi il sito
        # Un server statico vero: `file://` non registra i service worker e
        # non applica la Content Security Policy, quindi collaudarci non
        # dimostra niente. È l'errore che ha lasciato passare una CSP rotta.
        run: |
          npx http-server . -p 8765 -c-1 --silent &
          npx wait-on http://127.0.0.1:8765/build.json -t 30000

      - name: Terminologia della UI consumer
        run: npx playwright test tests/ui/terminologia.spec.js --project=${{ matrix.browser }}

      - name: Indicatore Lavoro/Vita (UI-006)
        # Le 14 asserzioni strutturali girano sempre e bloccano sempre. Il
        # confronto visivo gira solo contro riferimenti APPROVATI, cioè
        # versionati: vedi l'intestazione di tests/ui/ui006.spec.js.
        run: npx playwright test tests/ui/ui006.spec.js --project=${{ matrix.browser }}
        env:
          # DIFETTO CORRETTO — qui c'era `PW_UPDATE_SNAPSHOTS`, che Playwright
          # NON legge: non esiste una variabile d'ambiente con quel nome.
          # L'input «aggiorna_riferimenti_visivi» era quindi decorativo, e
          # chi lo avesse messo a `true` non avrebbe ottenuto niente — senza
          # alcun errore che lo dicesse. La variabile giusta è letta da
          # playwright.config.js.
          PT_APPROVA_SCATTI: ${{ inputs.aggiorna_riferimenti_visivi && '1' || '' }}

      - name: Impaginazione (UI-007)
        # Le regole misurabili dell'impaginazione: una colonna per i titoli,
        # 24px di bersaglio, 12px di testo informativo, un titolo di primo
        # livello per schermata, e i blocchi dell'agenda che non tagliano il
        # proprio nome. Sono numeri, non gusto: vedi UI-LAYOUT-REPORT.md.
        run: npx playwright test tests/ui/impaginazione.spec.js --project=${{ matrix.browser }}

      - name: Primo accesso (UI-008)
        # Le quattro promesse del primo accesso che si possono rompere senza
        # accorgersene: il tour compare UNA volta e non a chi è già dentro,
        # si salta sempre, la modalità scoperta spenta non aggiunge un solo
        # nodo, e la checklist non si prende meriti che non sono suoi.
        # Verifica anche dove finiscono le preferenze: sul dispositivo, non
        # nei dati sincronizzati. Vedi UX-PRIMO-ACCESSO.md.
        run: npx playwright test tests/ui/primo-accesso.spec.js --project=${{ matrix.browser }}

      - name: Profili, modalità e personalizzazione (SET-002)
        # Quattro difetti misurati, e quattro prove che li tengono chiusi:
        # il profilo cambiava anche la modalità contraddicendo la regola
        # scritta in js/modules.js; la modalità non aveva un comando in
        # nessuna schermata, quindi era raggiungibile solo come effetto
        # collaterale del profilo; il ritorno al preset si eseguiva subito
        # spiegando dopo con un conteggio; e l'elenco delle parti non
        # distingueva una scelta dell'utente da un preset del profilo.
        # La logica è coperta da tests/unit/profili.test.js: qui si verifica
        # che i comandi esistano nella pagina e che la conferma preceda
        # l'azione. Vedi PROFILI-REPORT.md.
        run: npx playwright test tests/ui/profili.spec.js --project=${{ matrix.browser }}

      - name: Sentinelle dei segreti
        run: npx playwright test tests/security/sentinelle.test.js --project=${{ matrix.browser }}

      - name: Cancellazione
        run: npx playwright test tests/e2e/cancellazione.spec.js --project=${{ matrix.browser }}

      - name: CSP, PWA, offline, responsive
        run: npx playwright test tests/e2e/piattaforma.spec.js --project=${{ matrix.browser }}

      - name: Accessibilità
        run: npx playwright test tests/a11y/ --project=${{ matrix.browser }}

      - name: Stato della regressione visiva
        # Non fa fallire nulla: dice quante comparazioni visive sono state
        # saltate per mancanza di riferimenti approvati. Serve perché da
        # quando il confronto viene saltato invece di fallire, «verde» può
        # significare «zero copertura visiva», e va detto invece di lasciarlo
        # dedurre.
        if: always()
        run: node strumenti/stato-regressione-visiva.mjs

      - name: Rapporto e scatti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            tests/ui/ui006.spec.js-snapshots/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────
  # 3. VERDETTO — un solo posto dove guardare
  # ───────────────────────────────────────────────────────────────────────
  verdetto:
    name: Verdetto
    runs-on: ubuntu-latest
    needs: [build, browser]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: artefatti

      - name: Riepilogo
        run: |
          {
            echo "## Verifica di Pannello Tempo"
            echo ""
            echo "| Lavoro | Esito |"
            echo "|---|---|"
            echo "| Build e collaudi locali | ${{ needs.build.result }} |"
            echo "| Collaudi in browser | ${{ needs.browser.result }} |"
            echo ""
            echo "Impronta: \`$(cat artefatti/build/impronta-1.txt 2>/dev/null || echo 'non disponibile')\`"
            echo ""
            echo "### Che cosa fare di questo esito"
            echo ""
            echo "Gli stati dei ticket in BACKLOG-COVERAGE.md si aggiornano SOLO"
            echo "con un esito reale davanti. In particolare:"
            echo ""
            echo "- **SEC-002** passa a COMPLETATO solo se il passo «Regole Firestore"
            echo "  su Emulator» riporta \`falliti: 0\`."
            echo "- **UI-006** passa a COMPLETATO solo se la regressione visiva è"
            echo "  verde con riferimenti approvati, non appena generati."
            echo "- **PRV-002** passa a COMPLETATO solo se «Cancellazione» è verde."
            echo ""
            echo "Vedi RUN-CI.md, sezione «Che cosa restituire»."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fallisci se qualcosa è rosso
        if: needs.build.result != 'success' || needs.browser.result != 'success'
        run: |
          echo "Almeno un lavoro non è riuscito: vedi il riepilogo."
          exit 1
